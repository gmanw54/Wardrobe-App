        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Closet Calculator",

        "description": "Calculate and style outfit combinations from your digital closet with Gemini AI vision and personalized lookbook recommendations."
      }
    </script>
    <script>
      (function() {
        function isIgnored(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.includes('websocket') || s.includes('failed to connect') || s.includes('closed without opened') || s.includes('[vite]');
        }
        var origError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (firstArg && isIgnored(firstArg)) {
            return;
          }
          return origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var firstArg = arguments[0];
          if (firstArg && isIgnored(firstArg)) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || e.reason) : '');
          if (isIgnored(reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && (e.error.message || e.error)));
          if (isIgnored(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        // Suppress any Vite error overlay that mentions websocket
        try {
          var observer = new MutationObserver(function(mutations) {
            for (var i = 0; i < mutations.length; i++) {
              for (var j = 0; j < mutations[i].addedNodes.length; j++) {
                var node = mutations[i].addedNodes[j];
                if (node && node.tagName && node.tagName.toLowerCase() === 'vite-error-overlay') {
                  var text = (node.shadowRoot ? node.shadowRoot.textContent : node.textContent) || '';
                  if (isIgnored(text)) {
                    node.remove();
                  }
                }
              }
            }
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>

  </body>

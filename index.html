<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Wardrobe & AI Stylist</title>
    <meta name="description" content="Cross-platform mobile wardrobe and styling application built for React Native and Expo with Gemini AI vision and personalized outfit generation." />
    <meta property="og:title" content="Mobile Wardrobe & AI Stylist" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        function isIgnored(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return s.includes('websocket') || s.includes('failed to connect') || s.includes('closed without opened') || s.includes('vite');
        }
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason ? (e.reason.message || e.reason) : '');
          if (isIgnored(reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && (e.error.message || e.error)));
          if (isIgnored(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
